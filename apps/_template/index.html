<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#07111f"><meta name="description" content="Starter template for an independent PWA."><link rel="manifest" href="./manifest.json"><title>New PWA Template</title><style>:root{color-scheme:dark;--bg:#07111f;--panel:#101d30;--line:#29425f;--cyan:#55e6ff;--muted:#a9bad0}*{box-sizing:border-box}body{margin:0;min-height:100vh;background:radial-gradient(ellipse at top,#142945,var(--bg) 60%);color:#f5f8ff;font:16px/1.5 system-ui,sans-serif}.wrap{max-width:760px;margin:auto;padding:24px 16px}.back{color:var(--cyan);text-decoration:none}.panel{margin-top:28px;border:1px solid var(--line);background:var(--panel);border-radius:20px;padding:24px}h1{font-size:clamp(2rem,7vw,3rem);line-height:1.1}.muted{color:var(--muted)}button{border:0;border-radius:10px;background:var(--cyan);color:#04121c;font-weight:800;padding:11px 15px;cursor:pointer}</style></head><body><main class="wrap"><a class="back" href="../../">← Multiapp Hub</a><section class="panel"><p style="color:var(--cyan);letter-spacing:.14em;text-transform:uppercase;font-weight:800;font-size:.8rem">Independent PWA starter</p><h1>Build your next app.</h1><p class="muted">Copy this folder to a new folder under <code>apps/</code>. Give it its own manifest, service worker cache name, app logic, and dashboard link.</p><button id="demo">Test app interaction</button><p id="status" class="muted" aria-live="polite">Template ready.</p></section></main><script>document.getElementById('demo').addEventListener('click',()=>document.getElementById('status').textContent='Your independent PWA JavaScript is running. Replace this demo with your own feature.');if('serviceWorker'in navigator&&location.protocol!=='file:')navigator.serviceWorker.register('./sw.js').catch(()=>{});</script></body></html>
